<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Tool Fault Diagnosis 推广图</title>
  <desc id="desc">展示 CANN 日志从多源采集、根因诊断到量化报告的三阶段闭环工作流。</desc>

  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#171a1d" flood-opacity="0.08"/>
    </filter>
    <pattern id="micro-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#171a1d" opacity="0.07"/>
    </pattern>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#e6002d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-white" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Arial Unicode MS", Arial, sans-serif; letter-spacing: 0; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; letter-spacing: 0; }
      .ink { fill: #171a1d; }
      .muted { fill: #6d7378; }
      .red { fill: #e6002d; }
      .eyebrow { font-size: 21px; font-weight: 700; }
      .title { font-size: 78px; font-weight: 800; }
      .subtitle { font-size: 28px; font-weight: 400; }
      .stage-kicker { font-size: 18px; font-weight: 700; }
      .stage-title { font-size: 38px; font-weight: 750; }
      .stage-copy { font-size: 20px; font-weight: 500; }
      .small { font-size: 17px; }
      .tiny { font-size: 15px; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1920" height="1080" fill="#f4f5f2"/>
  <rect x="1460" y="0" width="460" height="330" fill="url(#micro-grid)"/>
  <path d="M1740 0h180v180z" fill="#e6002d"/>
  <path d="M1812 0h108v108z" fill="#ffca28"/>
  <rect x="120" y="74" width="8" height="28" fill="#e6002d"/>
  <text x="148" y="96" class="eyebrow ink">CANN · AI AGENT SKILLS</text>
  <text x="120" y="210" class="title" fill="#e6002d">CANN</text>
  <text x="370" y="210" class="title ink">Tool Fault Diagnosis</text>
  <text x="120" y="268" class="subtitle muted">采集、诊断、度量，一条闭环解决日志问题</text>

  <!-- Header signal -->
  <g transform="translate(1508 182)">
    <rect x="0" y="0" width="252" height="64" rx="4" fill="#171a1d"/>
    <circle cx="34" cy="32" r="7" fill="#4ecb8d"/>
    <text x="56" y="39" font-size="17" font-weight="700" fill="#ffffff" class="mono">LOG → ROOT CAUSE</text>
  </g>

  <!-- Section label -->
  <text x="120" y="354" class="stage-kicker muted">WORKFLOW</text>
  <line x1="242" y1="347" x2="1800" y2="347" stroke="#d6d9d6" stroke-width="2"/>
  <text x="1738" y="354" class="stage-kicker muted">01—03</text>

  <!-- Flow arrows -->
  <path d="M606 590 H698" fill="none" stroke="#e6002d" stroke-width="4" marker-end="url(#arrow-red)"/>
  <circle cx="652" cy="590" r="7" fill="#f4f5f2" stroke="#e6002d" stroke-width="3"/>
  <path d="M1206 590 H1298" fill="none" stroke="#e6002d" stroke-width="4" marker-end="url(#arrow-red)"/>
  <circle cx="1252" cy="590" r="7" fill="#f4f5f2" stroke="#e6002d" stroke-width="3"/>

  <!-- Stage 01 -->
  <g filter="url(#card-shadow)">
    <rect x="120" y="390" width="486" height="390" rx="8" fill="#ffffff"/>
  </g>
  <rect x="120" y="390" width="10" height="390" fill="#1677ff"/>
  <text x="158" y="438" class="stage-kicker" fill="#1677ff">01 / COLLECT</text>
  <text x="158" y="490" class="stage-title ink">多源采集</text>
  <text x="158" y="527" class="stage-copy muted">日志自动汇聚，统一时间线</text>

  <g transform="translate(158 560)">
    <rect x="0" y="0" width="410" height="52" rx="4" fill="#edf5ff"/>
    <rect x="0" y="0" width="6" height="52" fill="#1677ff"/>
    <text x="24" y="33" class="mono small ink" font-weight="700">PLOG</text>
    <path d="M116 18h258M116 27h220M116 36h242" stroke="#8fbdf6" stroke-width="4" stroke-linecap="round"/>

    <rect x="0" y="64" width="410" height="52" rx="4" fill="#eef9f4"/>
    <rect x="0" y="64" width="6" height="52" fill="#18a66b"/>
    <text x="24" y="97" class="mono small ink" font-weight="700">HOST</text>
    <path d="M116 82h236M116 91h270M116 100h196" stroke="#8fd4b6" stroke-width="4" stroke-linecap="round"/>

    <rect x="0" y="128" width="410" height="52" rx="4" fill="#fff8df"/>
    <rect x="0" y="128" width="6" height="52" fill="#e3a500"/>
    <text x="24" y="161" class="mono small ink" font-weight="700">DEVICE</text>
    <path d="M116 146h270M116 155h206M116 164h252" stroke="#ebce73" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="158" y="756" class="small muted">自动采集 · 时间对齐 · 完整性检查</text>

  <!-- Stage 02 -->
  <g filter="url(#card-shadow)">
    <rect x="720" y="390" width="486" height="390" rx="8" fill="#171a1d"/>
  </g>
  <rect x="720" y="390" width="10" height="390" fill="#e6002d"/>
  <text x="758" y="438" class="stage-kicker" fill="#ff496c">02 / EVALUATE</text>
  <text x="758" y="490" class="stage-title" fill="#ffffff">根因诊断</text>
  <text x="758" y="527" class="stage-copy" fill="#aeb4b8">从首报错追到代码与案例</text>

  <g transform="translate(758 560)">
    <rect x="0" y="0" width="410" height="116" rx="6" fill="#24282c" stroke="#3a4045"/>
    <circle cx="30" cy="28" r="6" fill="#e6002d"/>
    <text x="50" y="34" class="mono tiny" fill="#90979c">FIRST ERROR</text>
    <text x="24" y="84" class="mono" font-size="34" font-weight="800" fill="#ffffff">EZ9999</text>
    <text x="192" y="82" class="small" fill="#ffca28">AI Core Error</text>

    <g transform="translate(0 136)">
      <rect x="0" y="0" width="112" height="46" rx="4" fill="#2f3439"/>
      <text x="56" y="29" class="small" fill="#ffffff" text-anchor="middle">首错识别</text>
      <path d="M124 23h24" stroke="#ff496c" stroke-width="2" marker-end="url(#arrow-red)"/>
      <rect x="158" y="0" width="112" height="46" rx="4" fill="#2f3439"/>
      <text x="214" y="29" class="small" fill="#ffffff" text-anchor="middle">证据关联</text>
      <path d="M282 23h24" stroke="#ff496c" stroke-width="2" marker-end="url(#arrow-red)"/>
      <rect x="316" y="0" width="94" height="46" rx="4" fill="#e6002d"/>
      <text x="363" y="29" class="small" fill="#ffffff" text-anchor="middle">根因</text>
    </g>
  </g>
  <text x="758" y="756" class="small" fill="#aeb4b8">支持 Coredump / Stackcore / 历史案例</text>

  <!-- Stage 03 -->
  <g filter="url(#card-shadow)">
    <rect x="1320" y="390" width="480" height="390" rx="8" fill="#ffffff"/>
  </g>
  <rect x="1320" y="390" width="10" height="390" fill="#18a66b"/>
  <text x="1358" y="438" class="stage-kicker" fill="#15885a">03 / METRIC</text>
  <text x="1358" y="490" class="stage-title ink">量化报告</text>
  <text x="1358" y="527" class="stage-copy muted">把诊断结论转成行动依据</text>

  <g transform="translate(1358 570)">
    <text x="0" y="18" class="small ink">errMsg 质量</text>
    <text x="404" y="18" class="mono small ink" text-anchor="end" font-weight="700">92</text>
    <rect x="0" y="34" width="404" height="8" rx="4" fill="#e8ebe8"/>
    <rect x="0" y="34" width="372" height="8" rx="4" fill="#18a66b"/>

    <text x="0" y="82" class="small ink">根因可信度</text>
    <text x="404" y="82" class="mono small ink" text-anchor="end" font-weight="700">87</text>
    <rect x="0" y="98" width="404" height="8" rx="4" fill="#e8ebe8"/>
    <rect x="0" y="98" width="351" height="8" rx="4" fill="#1677ff"/>

    <rect x="0" y="112" width="404" height="50" rx="4" fill="#eef9f4"/>
    <circle cx="30" cy="137" r="12" fill="#18a66b"/>
    <path d="M24 137l4 4 8-9" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="134" class="small ink" font-weight="700">输出可执行修复建议</text>
    <text x="56" y="155" class="tiny muted">含优先级、影响范围与验证计划</text>
  </g>
  <text x="1358" y="756" class="small muted">基线对比 · 结构化报告 · 优先级排序</text>

  <!-- Footer / closed loop -->
  <rect x="0" y="852" width="1920" height="228" fill="#171a1d"/>
  <g transform="translate(120 902)">
    <text x="0" y="22" class="stage-kicker" fill="#ff496c">一句话开始</text>
    <rect x="0" y="44" width="486" height="74" rx="6" fill="#24282c" stroke="#3b4146"/>
    <text x="28" y="91" class="mono" font-size="24" font-weight="700" fill="#ffffff">分析 ./logs</text>
    <rect x="370" y="62" width="88" height="38" rx="4" fill="#e6002d"/>
    <text x="414" y="87" class="small" text-anchor="middle" fill="#ffffff" font-weight="700">RUN</text>
  </g>

  <g transform="translate(720 900)">
    <text x="0" y="24" class="stage-kicker" fill="#aeb4b8">CONTINUOUS LOOP</text>
    <g transform="translate(0 54)">
      <text x="0" y="31" class="stage-copy" fill="#ffffff" font-weight="700">修复</text>
      <path d="M70 24h84" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow-white)"/>
      <text x="180" y="31" class="stage-copy" fill="#ffffff" font-weight="700">重跑</text>
      <path d="M250 24h84" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow-white)"/>
      <text x="360" y="31" class="stage-copy" fill="#ffffff" font-weight="700">复测</text>
      <path d="M430 24h84" stroke="#e6002d" stroke-width="3" marker-end="url(#arrow-red)"/>
      <text x="540" y="31" class="stage-copy" fill="#ff496c" font-weight="700">持续优化</text>
    </g>
  </g>

  <g transform="translate(1540 920)">
    <text x="260" y="18" class="tiny" fill="#7f878d" text-anchor="end">WORKS WITH</text>
    <text x="260" y="54" class="small" fill="#ffffff" text-anchor="end" font-weight="700">Codex · Claude Code</text>
    <text x="260" y="84" class="small" fill="#ffffff" text-anchor="end" font-weight="700">OpenCode · CodeFuse</text>
  </g>
</svg>
